frames:
  1: "明天就要结婚了，我却想不起他求婚的样子。"
  2: "他说这药能让我睡好。那晚忙乱，我漏吃了一次。"
  3: "梦里，我一抬脚，床底就响了一声。"
  4: "有人按住我的手，叫我别动。我看不清他的脸。"
  5: "醒来，脚踝还红着。"
  6: "婚礼彩排，他要我把恋爱六年背下来。"
  7: "他们只叫我新娘子。"
  8: "镜子里的妈，我不认识。"
  9: "婚鞋好沉。翻过来，鞋底焊着铁环。"
  10: "金镯里头有一道合缝，尽头是个小锁孔。"
  11: "我掀开窗上的红布，里面是一排封死的铁栏。"
  12: "车里还有新娘，脚上也带着铁。"
  13: "他又递来药：“吃完，明天就什么都不用想了。”"
  14: "他一转身，我把含着的药吐进了花盆。"
  15: "我举起还没扣上的金镯：“你是要拿这个锁我？”"
  16: "他伸手抢镯子。我推倒凳子，撞开后门就跑。"
  17: "我背得出恋爱六年的每一个细节，却想不起自己的名字。"
  18: "窗外有人喊了个名字，我没想就回了头。"
  19: "后来我又梦见自己试婚鞋。鞋底干干净净。"
  20: ""
