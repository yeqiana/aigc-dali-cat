frames:
  1: "明天就要结婚了，我却想不起他求婚的样子。"
  2: "他说这药能让我睡好。那晚忙乱，就漏了那一粒。"
  3: "梦里，我一抬脚，床底就响了一声。"
  4: "有人按住我的手，叫我别动。他的脸，我看不清。"
  5: "醒来，脚踝还红着。"
  6: "婚礼彩排，他让我把六年恋爱背成台词。"
  7: "他们只叫我新娘子。"
  8: "镜子里的妈，我不认识。"
  9: "婚鞋好沉。翻过来，鞋底焊着铁环。"
  10: "金镯里头有一道合缝，尽头是个小锁孔。"
  11: "红布后面，是一排封死的铁栏。"
  12: "车里还有新娘，脚上也带着铁。"
  13: "又是这药：“吃完，明天就什么都不用想了。”"
  14: "他一转身，我把含着的药吐进了花盆。"
  15: "我举起还没扣上的金镯：“你是要拿这个锁我？”"
  16: "他伸手来抢。我一把推倒凳子，撞开后门就跑。"
  17: "六年恋爱的每个细节我都背得出。名字，想不起来了。"
  18: "窗外有人喊了个名字，我没想就回了头。"
  19: "后来我又梦见自己试婚鞋。鞋底干干净净。"
  20: ""
silent_frames: [20]
