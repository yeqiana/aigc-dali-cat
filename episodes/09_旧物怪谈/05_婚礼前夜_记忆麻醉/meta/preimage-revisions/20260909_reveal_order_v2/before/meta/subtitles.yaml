frames:
  1: "明天就是婚礼了，可我总觉得不真实。"
  2: "他每天早晚都要盯着我吃，说我又要乱想了。"
  3: "梦里不是新房，是土墙，脚上还有铁。"
  4: "有人往我嘴里灌东西，还说“她醒了，快喂药”。"
  5: "他喂药的姿势，和梦里那个人一模一样。"
  6: "婚礼彩排，他要我把恋爱六年背下来。"
  7: "没一个叫我名字。"
  8: "镜子里的妈，我不认识。"
  9: "婚鞋好沉。翻过来，鞋底焊着铁环。"
  10: "金镯里头有一道合缝，尽头是个小锁孔。"
  11: "这不是新房，是一间土房。"
  12: "那不是新娘在看花轿，是货在看出货的车。"
  13: "最后一顿了。喝完，你就永远是新娘子了。"
  14: "我把药含在嘴里，趁他转身去照顾旁处，低头吐进床头的花盆。"
  15: "那现在，你是来给我锁上的吗？"
  16: "我趁乱撞开后门，往田里跑。"
  17: "我背得出恋爱六年的每一个细节，却想不起自己的名字。"
  18: "窗外有人喊我，喊的正是我想不起来的名字。"
  19: "如果那个梦才是真的，那我此刻是醒在哪一层？"
  20: ""
silent_frames: [20]
