voice_card:
  person: "林舟"
  age: "二十三岁"
  role: "高数重修考刚交卷的普通大学生；原本只想找个没信号的地方坐一会儿，却钻进了山后的石缝"
  education_and_knowledge_boundary: "会读书、会用手机拍照录视频；不知道这条山谷的来历，也没有任何野外常识"
  usual_terms: "考试、实习证明、手机、信号、石缝、石渠、竹林、麦饭、糖"
  recording_reason: "本来只想找个没有蜂窝信号的地方喘口气，顺手用手机记下看到的东西"
  knows_now: "只说当时亲眼看到的动作、听到的原话，和自己身体上的反应"
  does_not_know: "不知道这些人是哪一代逃进来的，也不知道石缝外面还有没有别的路"
  allowed_technical_terms: "手机、电筒、信号、糖、糖纸、湿纸巾、麦饼"
  forbidden_technical_terms: "异常本体、甲片结构、卧兽形态、空间拓扑、尺度映射、封闭系统"
  stress_language: "句子变短，先说动作和后果，不解释原因"
  fear_language_change: "少解释，允许停顿和改口；最后几格像自言自语"
silent_frames: []
frames:
  1: "走廊里，我背着包，头发湿得贴在额头上。"
  2: "铁丝网塌了个口，我从草里钻了进去。"
  3: "桃花烂在渠边，可渠底还有新踩出来的脚印。"
  4: "石缝窄得只能侧着身往里挤。"
  5: "一出石缝，四面是崖，底下却有个村子。"
  6: "我踢落的石子砸进溪里。田里的人全停下来看我。"
  7: "一个大叔把锄头插进泥里：\n“外头来的？先进屋吃碗热的。”"
  8: "吃饭时，秦叔说：\n“外头的响动，别进娃们的耳朵。”"
  9: "屋檐外全是雾，我就这么望着谷里。"
  10: "小石蹲在石台边，眼睛盯着那块黑屏。"
  11: "秦叔那句话我记得。\n可我还是剥了颗薄荷糖，递给小石。"
  12: "他眼睛猛地瞪圆，嘴也张开了。"
  13: "我把黑屏手机举给他看。"
  14: "秦叔一刀劈下去，厚竹当场裂开。"
  15: "半夜，他把糖纸和湿纸巾搁在床头：\n“天亮前出山。”"
  16: "石缝口，秦叔把叶包塞到我手里。"
  17: "钻进石缝前，我回头看了眼。\n炊烟照常升，那村子却像一口井。"
  18: "一出洞，山下的货车声就撞过来，\n脚底还传来打桩机的震动。"
  19: "导员催实习证明。\n表哥发来面试，我妈催我回电话。"
  20: "一手手机，一手那包吃的。\n我踩着泥鞋往山下走。"
