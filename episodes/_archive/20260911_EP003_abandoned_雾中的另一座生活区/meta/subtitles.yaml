# EP03《雾中的另一座生活区》正式字幕源 V1.0
# 声音权威：meta/voice-contract.json（LOCKED）；本文件只承载最终发布文案。
# 硬规则：单帧不超过 48 字；10 / 17 为无字幕关键图（画面自证，不翻译画面）。

voice_card:
  person: "P01"
  age: "24岁"
  role: "普通中国男青年／川西自驾旅行当事人"
  education_and_knowledge_boundary: "普通城市年轻人，只懂日常手机、导航和消费级无人机的基本使用；不具备气象、测绘、地理、影像取证或异常研究专业知识。"
  recording_reason: "和女友旅行时习惯用手机随手记录，车里带的无人机只用于拍普通风景和云海；不是调查取证。"
  knows_now: "只知道前两次经历并非单纯自己看错；这次亲眼看见雾后存在一个完整生活区、下面的人会注意到无人机、无人机最终失联且缓存留下异常空间证据。"
  does_not_know: "不知道另一边是什么地方、为什么会出现、是否属于过去未来或其他世界，也不知道无人机为何失控；不得替系统下结论。"
  stress_language: "紧张时句子变短，会出现'先回来''等一下''不对''我再看一眼'这类普通口语，不使用分析腔。"
  fear_language_change: "前半段还能解释和自我怀疑，后半段减少完整解释句，只保留确认、否认和行动反应；最后回到克制复盘。"
  ordinary_vocabulary: "雨停了、雾、下面、屋顶、田、路、车、图传、没信号、回来、别飞了、我们走吧"
  forbidden_technical_terms: "平行宇宙、维度、量子、空间裂隙、虫洞、时空重叠模型、坐标异常、磁场干扰、测绘数据、遥感异常"

frames:
  1: "前两天的事，我们都没再提。"
  2: "雨停了，我想顺手补一点云海和山谷。"
  3: "升高一点，雾下面先露出一个屋顶。"
  4: "往旁边再挪一点，下面还有田。"
  5: "路上还有人在赶牲口，像刚淋过同一场雨。"
  6: "她先认出来的，那条弯路像第一晚那条。"
  7: "那不是人影，下面有人在过日子。"
  8: "我第一次觉得，下面不像临时聚起来的一群人。"
  9: "她说，那种浅色粗布我们好像见过。"
  11: "最远那边，还有一座很大的旧石头建筑。"
  12: "路边那个人，我当时根本没注意。"
  13: "第一个抬头的，是个老人。"
  14: "接着，下面的人开始一个个往屋里收东西。"
  15: "她让我回来。我说好，但还是多看了几秒。"
  16: "就这几秒，返航方向开始不对了。"
  18: "我当时只觉得，远处那块特别亮。"
  19: "后来放大最后一帧，我才看见车旁边还有人。"
  20: "我们没下山找。她关上车门，我也没再说要证明什么。"

silent_frames: [10, 17]
