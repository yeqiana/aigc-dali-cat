voice_card:
  person: "P01"
  age: "24岁"
  role: "普通年轻人/当事人"
  education_and_knowledge_boundary: "普通上班族日常常识；能排查反光、站位和窗外结构，但不知道异常机制与对面身份。"
  recording_reason: "用普通手机记录情侣自驾、住宿环境及供两人确认的异常片段，不以调查或传播为职业目的。"
  knows_now: "亲眼确认玻璃后存在会观察、害怕并保护孩子的普通人，现实窗外没有站立条件。"
  does_not_know: "不知道空间为何重叠、对面属于哪里、人物身份与年代，也不能裁决现实解释或异常解释。"
  stress_language: "短句、停顿、自我修正和生活化判断，不使用报告腔。"
  fear_language_change: "先说动作和位置，紧张时句子变短；高潮后从证明真假转向理解对方。"
  ordinary_vocabulary: "雨、窗、雾、袖子、手机、孩子、别拍了、该走了。"
  forbidden_technical_terms: "维度、量子、频率、时空裂缝、实验体、能量场、传送门。"

frames:
  1: "翻过折多山，我们沿着山路继续往前开，雨渐渐下起来了。"
  2: "傍晚雨太大，我们临时住进山谷里的民宿。"
  3: "她找充电线时，窗外剩下的雨水像被谁擦开了一块。"
  4: "我先关了灯。那截袖子没有跟着我们动。"
  5: "她换了两个位置，玻璃里那个人都慢半拍。"
  6: "还是太糊。那一刻我其实有点不甘心。"
  7: "第二次露出来的，是一张正在用的矮凳和木碗。"
  8: "她没敲窗，只是顺手把眼前的雾擦掉了。"
  10: "那不是一张等着吓人的脸。他也在看我们怕什么。"
  11: "我只是想拍清一点，他马上拿东西挡住了自己。"
  12: "她按住我，说别一直对着人家拍。"
  13: "然后，他身后探出来一个孩子。"
  15: "手机暗下去以后，他还是把孩子护在了身后。"
  16: "我自己停掉了录像。那几秒本来会是最清楚的。"
  17: "那一晚，我们第一次没争论自己是不是看错了。"
  18: "第二天，窗外还是一面够不到的外墙。"
  19: "回看时我才发现，他整晚都在根据我们的动作做决定。"
  20: "所以他们真的是在防着我们吗？"

silent_frames: [9, 14]
