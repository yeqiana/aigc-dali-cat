# 权威字幕 V1.0（Story OS V2.6.1 / 全自动生产）。
# 第一人称声音：P01；正式字幕前完成声音卡，见 voice_card。
frames:
  1: "凌晨四点就上山了，就为了看一眼日出。"
  2: "本来只想拍点风景，顺手把无人机放上去了。"
  3: "穿过云以后，底下居然有屋顶。"
  4: "我又往下压了一点。有人在收昨晚淋湿的衣服。"
  5: "田是一层压一层的，水渠还在放水。"
  6: "再往外，石路两边摆着摊子。"
  7: "半山腰那道石砌水道，比村里的房子还大。"
  8: "云一散，后面全是屋顶。这哪是村子。"
  9: "那条路上，人和牲口一直没断过。"
  10: "她说别飞了，拉回来。我手已经在往回推。"
  11: "有个小孩先看见了它。"
  12: "大人跟着抬头，先把孩子拉到身后。"
  13: "有人开始收摊，也有人还没察觉。"
  14: "她先把孩子往后带，自己又多看了几秒。"
  15: "本该收工的，我多停了几秒。"
  16: "窗一扇扇合上。是我们闯进了别人的清早。"
  17: "想全力拉回来的时候，画面开始卡，高度往下掉。"
  18: "最后几秒，屏幕边上有一小块不对劲的亮。"
  19: "失联了。她第一次拦着我，说别去了。"
  20: "太阳照常升起，云海还是好看。无人机没回来。"
silent_frames: []
