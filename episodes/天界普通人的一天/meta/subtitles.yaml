voice_card:
  person: "P01"
  age: "25岁"
  role: "天界基层清扫员/当事人"
  education_and_knowledge_boundary: "普通基层劳动者的日常常识：会看试岗工单、清扫路段、装袋、过秤、交接和看排班；能判断两种砂外观与颗粒是否相同，但不懂星砂成因，也没有任何岗位技能可以解释异常。"
  recording_reason: "用随身上岗记录牌按规程记录作业过程与交接；异常出现后只是顺手把画面留着，不以调查、取证或传播为目的。"
  knows_now: "亲眼确认星砂铺在地上会亮，被扫拢、离地或装袋就熄灭，天亮后剩余部分也会自然熄灭；熄光后的星砂与天街原有铺砂是同一种材料，并在清运点作为普通路面回填料回收。自己完成三袋与全段清扫后，试岗通过并转为固定落星街早班。"
  does_not_know: "不知道星砂为什么会亮、为什么清扫后熄灭，也不知道最初从哪里来；他只知道基层单位一直把熄光后的砂当普通回填料使用，不能把这个工作事实上升成星砂来源解释。"
  stress_language: "短句、停顿、自我修正和干活时的碎念；压力上来时只说还剩哪一段、第三袋装到哪、试岗时间还剩多少，不用励志口号和报告腔。"
  fear_language_change: "本集不是恐惧叙事。第一次看见熄光时只是短暂停顿和确认；试岗时限压上来以后语句更短、更实际，围绕扫完、装袋、过秤，不喊不叫、不把星砂妖魔化。"
  ordinary_vocabulary: "星砂、扫帚、簸箕、袋子、台阶、工单、试岗、机动、排班、过秤、交接、回填料、早班、下班"
  forbidden_technical_terms: "能量场、粒子、量子、维度、频率、磁场、结界、法术、灵气、修仙、封印"

silent_frames: [15]

frames:
  1: "这两个月我每天都不知道明天会被派去哪。"
  2: "今天扫完这条路，明天我就不用再等临时派班了。"
  3: "第一次看见落星街，我差点忘了自己是来扫地的。"
  4: "我先从最上面这一段开始。"
  5: "扫帚一拢，光就没了。"
  6: "她让我先把她家门口扫干净。"
  7: "缝里的砂，跟刚扫暗那堆很像。"
  8: "人一多，刚扫出来的又被带回去了。"
  9: "这会儿怕的不是砂，是今天这条线会超时。"
  10: "原来这条路，本来就用这种砂填着。"
  11: "天一亮，它们自己暗了，人也更不躲了。"
  12: "这段比前面两段加起来还慢。"
  13: "留着它，今天这条路就不算清完。"
  14: "我还是把扫帚压了下去。"
  16: "三袋，重量刚够。"
  17: "我一直以为扫走以后，它们就算没了。"
  18: "明早还是这个点。"
  19: "早上扫走的，下午又回了这条路。"
  20: "昨晚是星光，今早是垃圾，过完秤以后，又成了这条路。"

