voice_card:
  person: "林澈，二十多岁的科考队员"
  age: "二十多岁"
  role: "陪阿叔执行最后一次东海勘探的潜航器队员"
  education_and_knowledge_boundary: "会用潜航器、声呐和手机地图；认得出常规海洋生物；不知道龙宫和龙是什么"
  usual_terms: "阿叔、潜航器、观察窗、声呐、灯光、宫门、龙、潮痕"
  recording_reason: "随队记录这趟最后的勘探任务"
  knows_now: "只说自己看到的：发光的建筑、宫门、龙、摆尾、甲板上的潮痕"
  does_not_know: "不知道龙宫是谁建的、龙是什么、它为什么放我们走"
  allowed_technical_terms: "潜航器、观察窗、声呐、坐标"
  forbidden_technical_terms: "构造地质、流体力学、深海生物学术名、生物发光机制、神话学"
  stress_language: "句子变短，先说眼前的动作"
  fear_language_change: "害怕时句子更短更直，不解释原因，结尾只陈述余波"

frames:
  1: "我陪阿叔出最后一趟海。\n灯扫过去，海底立着一片发光的建筑。"
  2: "阿叔要退休了。\n手机里，存着他三十年前拍过的东西。"
  3: "阿叔说，看一眼就走。\n声呐上那排信号，太整齐了。"
  4: "石柱上的纹路在发光。\n像长在石头里。"
  5: "阿叔按住我的手腕：\n看到发亮的东西，别靠近。"
  6: "建筑群的尽头，立着一扇大门。\n门缝里，透出不该在深海的光。"
  7: "我以为撞上了古遗址。\n门开了，里面盘着一条龙。"
  8: "水流突然改了方向。\n把我们往那扇门里推。"
  9: "它睁眼了。\n瞳孔，看向我们。"
  10: "它发现我们了。\n水流开始往回顶，潜航器在抖。"
  11: "它靠过来。\n一只瞳孔，比整扇观察窗还大。"
  12: "它没有攻击，只是慢慢摆了一下尾。\n水流开始送我们出去。"
  13: "我关掉了灯。\n黑暗里，只有它的光还在。"
  14: "我们退出宫门，慢慢倒出去。\n门在身后合拢，它还在看着我们。"
  15: "阿叔说，那张照片是真的。\n当年上报过，被压了下来。"
  16: "我在备忘录里记下：坐标封存。\n这里的事，不再上报。"
  17: "船离开了那片海。\n水面很平，像什么都没发生。"
  18: "下船前，我看到一道潮痕。\n形状，像一片鳞。"
  19: "我把海里的鳞纹截图翻出来。\n和甲板上那道潮痕，一模一样。"
  20: "潮痕还在发着微光。\n那条龙，还在下面。"

silent_frames: []

