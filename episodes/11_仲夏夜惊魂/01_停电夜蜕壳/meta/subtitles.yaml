voice_card:
  person: "周启明"
  age: "24岁"
  role: "返乡参加发小婚礼的普通县城青年，婚礼前一晚路过停电的县城"
  education_and_knowledge_boundary: "能认县城的店和路，会用手机拍照录视频；不知道县城底下到底是什么"
  usual_terms: "停电、药房、墙皮、路面、山脊、伴郎、手机"
  recording_reason: "夜里走回家顺手记录停电后的县城，越走越不对劲"
  knows_now: "只说当时亲眼看到的动作和后果"
  does_not_know: "不知道把它顶起来的是什么东西，也不知道县城会不会变回去"
  allowed_technical_terms: "手机、手电、车灯、药房"
  forbidden_technical_terms: "尺度映射、空间拓扑、异常本体、甲片结构、卧兽形态"
  stress_language: "句子变短，先说动作和后果"
  fear_language_change: "少解释，允许停顿；最后一格像自言自语"

frames:
  1: "到县城时，已经快十一点了。"
  2: "白天四十度，晚上还是闷得人喘不过气。"
  3: "我家离车站不远，打算走回去。"
  4: "23点03分，整条街突然黑了。"
  5: "打车软件转了半天，我只能继续走。"
  6: "我先以为是墙皮被晒坏了。"
  7: "可它后面那扇窗，位置不对。"
  8: "我退远一点，才发现不止这一面墙。"
  9: "连路面上，也有一层。"
  10: "整条街，像蒙着同一张皮。"
  11: "我得赶回去，明天还要当伴郎。"
  12: "它撕下一块粘到我包上，回头路也合上了。"
  13: "走到天桥下，我才看清它到底有多大。"
  14: "外面那层，和里面完全对不上。"
  15: "风一来，整条街都掀起来了。"
  16: "我这才明白，那根本不是墙皮。"
  17: "我刚跑出去，整座城就被它顶了起来。"
  18: "零点过几分，电来了。到家时，手机没了。"
  19: "药房外墙少了一块，和我抽屉里那块一样。"
  20: "第二天，县城看起来一切正常。"
