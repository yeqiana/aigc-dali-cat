voice_card:
  person: "周启明"
  age: "24岁"
  role: "返乡参加发小婚礼的普通县城青年，婚礼前一晚路过停电的县城"
  education_and_knowledge_boundary: "能认县城的店和路，会用手机拍照录视频；不知道县城底下到底是什么"
  usual_terms: "停电、药房、墙皮、路面、山脊、伴郎、手机"
  recording_reason: "夜里走回家顺手记录停电后的县城，越走越不对劲"
  knows_now: "只说当时亲眼看到的动作和后果"
  does_not_know: "不知道把它顶起来的是什么东西，也不知道县城会不会变回去"
  allowed_technical_terms: "手机、手电、车灯、药房"
  forbidden_technical_terms: "尺度映射、空间拓扑、异常本体、甲片结构、卧兽形态"
  stress_language: "句子变短，先说动作和后果"
  fear_language_change: "少解释，允许停顿；最后一格像自言自语"

frames:
  1: "我到县城的时候，已经快十一点了。"
  2: "白天四十度，晚上还是闷得喘不过气。"
  3: "我家离车站不远，我准备走回去。"
  4: "23点03分，整条街一下全黑了。"
  5: "打车软件一直转圈，我就继续往家走。"
  6: "我先以为是墙皮被晒坏了。"
  7: "可它后面那扇窗的位置，不对。"
  8: "我站远了一点，才发现不只这一面墙。"
  9: "连路面都有一层。"
  10: "它们像是同一张东西。"
  11: "我得在天亮前赶回家——明天我是伴郎。"
  12: "它撕下一块粘在包上，回头路也合上了。\n灯一照它卷得更快，我关了手电。"
  13: "我到天桥下面时，终于看清它有多大。"
  14: "外面那层，和里面根本对不上。"
  15: "那阵风一来，整条街都被掀了起来。"
  16: "我这才明白，它不是掉墙皮。"
  17: "我跑过去的时候，它把整座城顶了起来。\n松握的手机被卷走，攥紧包带的手只被划了一道。"
  18: "零点过几分，电来了。我到了家，手机却没了。"
  19: "药房外墙缺了一块——和我抽屉里那块一模一样。"
  20: "第二天我才发现，县城变旧，也许不是年头到了。"
