# 《泔水与金牌》正式字幕 V1.0（4:5 / 20 图）
# 声音卡权威来自 meta/voice-contract.json（LOCKED）；此处为同源镜像。
# 视觉参数按 standards/最终字幕视觉规范_V1.2.md；内容按 字幕人话化与声音卡规范_V1.1.md。
# 20 张全部带字幕：本集为用户 locked_story 原文的忠实展开，原文最后一句自问
# 「真能顺着这森严的骨阶，淌进我们这群蝼蚁的嘴里吗？」承担结局意义，故不做静默收尾，
# 逐帧内容与 docs/02_泔水与金牌_StoryLock_V1.0.md 正式剧情、docs/03 分镜一一对应。
# 换行按「句读处断开」手工指定，避免孤立标点落在第二行（视觉规范 §8）。

voice_card:
  person: "P01"
  age: "22"
  role: "狮驼岭南麓第二道哨卡敲梆子的巡山小妖（獐子精），连人形都没褪干净，腰上是骨头磨的腰牌"
  education_and_knowledge_boundary: "没念过书，不识字法，只会认自己腰牌背面那个刻歪的「巡」字；不知道唐僧是谁、取经是干什么的，也不知道长生不老意味着什么。整座山的规矩是他从轮班里一天一天看出来的：上面三层吃的不一样，下面的活儿不一样。"
  recording_reason: "轮夜班守卡，梆子要按点数敲到换班；空下来就把眼前的事在心里过一遍，怕自己哪天连哪一层该吃什么都会忘。没有人让他讲，他是讲给自己听的。"
  knows_now: "他知道这座山是分三层的，知道峰顶和回廊吃什么、自己这一层等什么；他知道那天清晨金牌令箭从山顶一路传下来说吃唐僧肉能长生不老；他知道同卡的野猪精当场撞碎了自家栅栏。"
  does_not_know: "他不知道唐僧肉到底会不会分下来、会怎么分、自己能不能分到；不知道金牌令箭是谁发的；不知道大王和上面那两层在打什么算盘，也不知道这件事最后会落到谁头上。"
  stress_language: "越到后面话越短，把看见的顺序一件一件摆出来，先说上面、再说自己这一层；句子主动加「我们」「咱们」，把话从自己身上挪到整层人身上。"
  fear_language_change: "发凉的时候不加形容词，改成一个很具体的身体动作：握住、没有放下、没有跟着走；句尾从陈述变成自问，用「真能……吗」收尾。"
  ordinary_vocabulary: "只用「梆子」「腰牌」「栅栏」「哨卡」「轮班」「后厨」「泔水」「盆」「山上」「下面」这类身边能摸到的词，不用「仙气」「道行」「业障」「宿命」「阶层」「分配」这类词。"
  forbidden_technical_terms: "不出现任何宗教、修行、经文法器类说法，不出现现代社会学与管理学词汇，不使用诵念式或经文式句式。"

frames:
  1: "我腰上这块牌子是骨头磨的，\n背面刻着一个「巡」字。"
  2: "我是狮驼岭南麓的獐子精，\n守第二道哨卡，敲梆子。"
  3: "八百里狮驼岭，妖魔四万八千。"
  4: "外面传这里是妖族的极乐净土，\n只有底下的草芥知道，净土也是分层的。"
  5: "我这一层连人形都没褪干净。"
  6: "峰顶白骨洞里，大王们撕扯仙禽异兽，\n剩下的挂满山崖当风幡。"
  7: "崖上那些东西每天从我们头顶晃过去，\n一个抬头的都没有。"
  8: "头目校尉坐在回廊里，大碗吃肉，\n喝带血的陈酿。"
  9: "轮到我们，等的是后厨倒出来那盆馊泔水。"
  10: "那天清晨，山道尽头有一点反光，\n正一点一点往下走。"
  11: "是金牌令箭。"
  12: "山顶上发一句话，\n得靠人一层一层往下递。"
  13: "那句话是：东土大唐的取经僧进了地界，\n吃他一口肉，可得长生不老。"
  14: "整座山顿时像滚油里泼了冷水。"
  15: "跟我一同守卡的野猪精，\n一头撞碎了我们自家的栅栏。"
  16: "他喊着要立头功，\n换半碗唐僧肉尝尝长生的滋味。"
  17: "满山的人都往上涌，\n我手里的梆子停在半空，没跟着走。"
  18: "敲了一夜，指节冻得发红，\n我一次也没把它放下。"
  19: "我握着冰凉的梆子，在满山的欢呼里\n只觉得后脖颈发凉。"
  20: "我们连剩汤都要抢破头，\n这肉真能顺着骨阶淌到我们嘴里吗？"

silent_frames: []
