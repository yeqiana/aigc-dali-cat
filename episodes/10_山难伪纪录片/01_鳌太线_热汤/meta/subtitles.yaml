voice_card:
  person: "27岁男性徒步者"
  age: "27岁"
  role: "与同龄队友再次挑战鳌太线的普通徒步者"
  education_and_knowledge_boundary: "知道基础徒步装备和下撤约定，不知道自己正在失温，也不能做医学诊断"
  usual_terms: "阿川、下撤、红绳、杯子、灯、热汤、左脚"
  recording_reason: "用胸前运动相机记录挑战过程，也给同行安全回看留证"
  knows_now: "只说当时看到的身体反应、路线、队友动作和眼前错觉"
  does_not_know: "不知道饭棚是否真实，也不知道自己从哪一刻开始无法可靠判断"
  allowed_technical_terms: "运动相机、头灯、安全绳、保温毯、保温杯"
  forbidden_technical_terms: "核心机制、认知障碍、悖论性脱衣、低体温症分级、感知重组、叙述可靠性"
  stress_language: "动作中句子变短，先说身体和方向"
  fear_language_change: "越靠近结尾越少解释，允许停顿；图20静默"

frames:
  1: "去年我走到半路就退了。这次，我想走完。"
  2: "出发前我和阿川说好，谁出问题谁就下撤。"
  3: "风才起来，袖口就结了霜，我却热得想拉开拉链。"
  4: "我摘下一只手套。阿川回头，让我赶紧戴回去。"
  5: "左脚踩进石缝，我听见自己叫了一声。"
  6: "阿川说，别再硬撑了。我说，再走一段。"
  7: "登山杖转向下坡。第二次，认了。"
  8: "走了没多远，脚居然不疼了。"
  9: "可每一步都踩不正，连安全扣都对不上。"
  10: "白茫茫一片，我只看那根红绳。"
  11: "右边突然亮起一排灯。可红绳，明明在左边。"
  12: "灯近得像在眼前，雪上却没有一条路。"
  13: "阿川把我按在石头后。他说已经叫了人。"
  14: "风停了。灯、热气，全在我眼前。"
  15: "桌上摆着热汤热菜，边上坐满了人。我闻到饭香了。"
  16: "汤冒着气。袖口的冰，一点没化。"
  17: "我喊了两声。没人抬头。"
  18: "我想端碗，手合不上，左脚也还是歪的。"
  19: "阿川叫我站起来。我推开他，坐回汤前。"

silent_frames: [20]
