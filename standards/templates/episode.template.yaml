schema_version: 1

# candidate | story_locked | visual_admission | production | subtitled | release_ready | published
stage: candidate

episode:
  id: "__EPISODE_ID__"
  title: "__EPISODE_TITLE__"
  series: "__SERIES__"
  owner: "啾啾脑洞故事"

format:
  publish_mode: image_carousel
  ratio: "9:16"
  width: 1080
  height: 1920
  frame_count: 20
  allowed_extensions: [png, jpg, jpeg]

paths:
  # 全部相对 episode.yaml 所在目录
  publish_dir: "v3_final/publish"
  subtitles_file: "docs/subtitles.yaml"

story:
  hook_frames: [1, 2, 3]
  # 正式批量出图前必须恰好 4 张，且全部通过人工视觉准入
  visual_admission_frames: [1, 7, 13, 20]
  escalation_frames: [5, 9, 13]
  climax_frame: 17
  payoff_frame: 20
  task_closed: false
  competing_explanations: 0

anti_homogeneity:
  recent5_checked: false
  four_locks_diff_count: 0
  # true = 已触发“机制换皮一票否决”，必须退回选题
  mechanism_skin_swap_veto: false

continuity:
  anchors:
    protagonist: ""
    location: ""
    key_prop: ""
    wardrobe: ""
    weather_time: ""

subtitles:
  required: true
  sound_card_completed: false
  max_lines: 2
  # 只用于提醒，不覆盖最终字幕视觉规范；如不想限制可设为 null
  max_chars_per_line: null

locks:
  # none | subtitle_only | crop_only | regenerate_frame | regenerate_sequence
  edit_mode: none
  assets: []
  # 示例：
  # - path: "workbench/locked/19.png"
  #   sha256: "0123456789abcdef...64位..."
  #   reason: "底图锁定，只改字幕"

review:
  authenticity: pending
  continuity: pending
  subtitle: pending
  story: pending
  visual_admission: pending
  production: pending
  recommendation_fit: pending
  publish: pending
  release_required:
    - authenticity
    - continuity
    - subtitle
    - story
    - visual_admission
    - production
    - recommendation_fit
    - publish
  waivers: {}
