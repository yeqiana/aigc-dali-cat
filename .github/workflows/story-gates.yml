name: Story Gates

on:
  pull_request:
    paths:
      - "episodes/**"
      - "standards/**"
      - "skills/dali-cat-story/**"
      - "SKILL.md"
  push:
    branches: [story]
    paths:
      - "episodes/**/episode.yaml"
      - "skills/dali-cat-story/**"
      - "standards/templates/**"
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install validator dependency
        run: python -m pip install -r skills/dali-cat-story/requirements.txt
      - name: Unit tests
        run: python -m unittest discover -s skills/dali-cat-story/tests -v
      - name: Validate episode manifests
        run: python skills/dali-cat-story/scripts/validate_repo.py .
