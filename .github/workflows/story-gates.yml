name: Story Gates

on:
  pull_request:
    paths:
      - "story_os_manifest.json"
      - "START_HERE.md"
      - "README.md"
      - "README_UPGRADE.md"
      - "INSTALL_WINDOWS.ps1"
      - "episodes/**"
      - "standards/**"
      - "runtimes/**"
      - "skills/dali-cat-story/**"
      - ".agents/skills/dali-cat-story/**"
      - "SKILL.md"
      - "AGENTS.md"
      - ".github/workflows/story-gates.yml"
  push:
    branches: [story]
    paths:
      - "story_os_manifest.json"
      - "START_HERE.md"
      - "README.md"
      - "README_UPGRADE.md"
      - "INSTALL_WINDOWS.ps1"
      - "episodes/**/meta/**"
      - "episodes/_system/**"
      - "skills/dali-cat-story/**"
      - ".agents/skills/dali-cat-story/**"
      - "standards/**"
      - "standards/templates/**"
      - "standards/AUTHORITY_INDEX.json"
      - "standards/capture_profiles/**"
      - "standards/story_regressions/**"
      - "runtimes/**"
      - "SKILL.md"
      - "AGENTS.md"
      - ".github/workflows/story-gates.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: story-gates-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: episodes/_system/requirements.txt
      - name: Install Story OS runtime dependencies
        run: python -m pip install -r episodes/_system/requirements.txt
      - name: Compile Story OS
        run: python -m compileall -q episodes/_system skills/dali-cat-story
      - name: State machine and Story OS unit tests
        run: |
          python episodes/_system/test_validator.py -v
          python episodes/_system/test_machine_gate.py -v
          python episodes/_system/test_production_reliability.py -v
          python episodes/_system/test_v2_multi_runtime.py -v
          python episodes/_system/test_v201_engineering.py -v
          python episodes/_system/test_v202_production_closure.py -v
          python episodes/_system/test_v203_contract_hardening.py -v
          python episodes/_system/test_v2032_creative_enforcement.py -v
          python episodes/_system/test_v2033_frame_semantic_enforcement.py -v
          # STORY_OS_V2_5_PROPAGATION_CORE
          python episodes/_system/test_v250_propagation_core.py -v
          python episodes/_system/propagation_core_gate.py self-test
          python episodes/_system/story_review.py self-test
          python episodes/_system/visual_review.py self-test
          python episodes/_system/frame_semantic_review.py self-test
          python episodes/_system/subtitle_layout.py self-test
          python episodes/_system/canvas_normalize.py self-test
          python episodes/_system/codex_subscription_image.py self-test
          python episodes/_system/incremental_closure.py self-test
          python episodes/_system/incremental_frame_review.py self-test
          python episodes/_system/media_workspace.py self-test
          python episodes/_system/codex_auto_orchestrator.py self-test
      - name: Validate Story OS contract and repository health
        run: |
          python episodes/_system/contract_sync.py
          python episodes/_system/story_os.py doctor
      - name: Validate tracked episode metadata
        run: python episodes/_system/validate_episode.py --all --metadata-only
      - name: Validate strict machine evidence metadata
        run: python episodes/_system/machine_gate.py --all --metadata-only
